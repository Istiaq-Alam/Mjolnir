storm-duration: 60

mode-switch-cooldown: 5

effects:
  enabled: true
  particles: true
  sounds: true

travel:
  # Completely removes fall damage after Mjolnir Riptide.
  cancel-fall-damage: true

  # Only used if cancel-fall-damage is false.
  # 2.0 = 1 heart.
  max-fall-damage: 2.0

  landing-thunder:
    # Thor-style thunder impact when landing from Travel Mode.
    enabled: true

    # Damage radius.
    radius: 9.0

    # Damage to hostile mobs.
    # 1000 is enough to instantly kill most normal mobs.
    damage: 1000.0

fighting:

  lightning-strike:
    enabled: true
    range: 9.0
    cooldown: 4
    damage: 12.0
    player-damage: false

  god-blast:
    enabled: true
    range: 12.0
    radius: 5.0
    cooldown: 8
    damage: 18.0
    knockback: 1.2
    player-damage: false

  mjolnir-smash:
    enabled: true
    radius: 4.0
    damage: 8.0
    cooldown: 2
    knockback: 0.8
    player-damage: false

resource-pack:
  enabled: true

  # Direct HTTPS URL to the Mjolnir-only resource pack ZIP.
  url: "https://download.mc-packs.net/pack/0b8945adf2fd13979845e4f30484705f555f51e5.zip"

  # SHA-1 hash of the ZIP file.
  # Leave empty temporarily if you have not generated it yet.
  sha1: "0b8945adf2fd13979845e4f30484705f555f51e5"

  # false = player may decline the pack.
  # true = player must accept it.
  required: true

  # Send the pack automatically when the player joins.
  send-on-join: true

  # Delay before sending the pack after joining, in ticks.
  # 40 ticks = 2 seconds.
  send-delay-ticks: 40

  prompt: "Mjolnir requires its custom weapon resource pack."
